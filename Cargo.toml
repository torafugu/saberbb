[package]
name = "saberbb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
better-panic = "0.3.0" # TODO: to beremoved
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6"
comfy-table = "7.2.2"
confy = "2.0.0"
console = "0.16.3"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
deadpool = "0.13.0"
dialoguer = "0.12.0"
directories = "6.0"
fluent-templates = "0.14.0"
futures = "0.3.31"
inquire = "0.9.4"
pretty_assertions = "1.4.1"
rand = { version = "0.10.1", features = ["std"] }
rand_distr = "0.6.0"
ratatui = { version = "0.30.0", features = ["serde", "macros"] }
rusqlite = { version = "0.40.0", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_rusqlite = "0.43.0"
signal-hook = "0.4.4"
strip-ansi-escapes = "0.2.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
unic-langid = "0.9"
validator = { version = "0.20.0", features = ["derive"] }
